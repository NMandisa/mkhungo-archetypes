# Define root logger options
# Set to debug or trace if log4j initialization is failing
status = warn

# Define Console appender configuration
appender.console.type = Console
appender.console.name = LogToConsole
appender.console.Target=SYSTEM_OUT
appender.console.layout.disableAnsi=false
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level - %msg%n
appender.console.immediateFlush=true

# Define loggers
logger.@artifactId@.name=@groupId@
#logger.${project.artifactId}.name=${project.groupId}
logger.${project.artifactId}.level=debug
logger.${project.artifactId}.additivity = false
logger.${project.artifactId}.appenderRef.console.ref = LogToConsole


# Root logger level
rootLogger.level = debug

# Root logger referring to console appender
rootLogger.appenderRef.console.ref = LogToConsole
